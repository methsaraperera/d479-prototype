<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taniti Tourism Website - Interactive Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="#" class="logo">Taniti Tourism</a>
            <nav>
                <a href="#">Home</a>
                <a href="#">Activities</a>
                <a href="#">Accommodations</a>
                <a href="#">My Favorites</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>Welcome to Taniti</h1>
        <p>Discover Beautiful Beaches, Lush Rainforests & Unforgettable Adventures</p>
    </section>

    <div class="search-section">
        <div class="search-box">
            <h2>Search Activities by:</h2>
            <div class="filters">
                <div class="filter-group">
                    <label>Activity Type</label>
                    <select onchange="#()">
                        <option value="">All Types</option>
                        <option value="beach">Beach & Water</option>
                        <option value="adventure">Adventure</option>
                        <option value="dining">Dining</option>
                        <option value="cultural">Cultural</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Duration</label>
                    <select onchange="#">
                        <option value="">Any Duration</option>
                        <option value="short">Under 2 Hours</option>
                        <option value="medium">2-4 Hours</option>
                        <option value="long">Half Day +</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <select onchange="#">
                        <option value="">Any Price</option>
                        <option value="budget">Under $50</option>
                        <option value="mid">$50-$100</option>
                        <option value="premium">$100+</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- CATEGORIES -->
        <h2 class="section-title">Explore by Category</h2>
        <div class="categories">
            <div class="category-card" onclick="#">
                <div class="category-emoji">🏖️</div>
                <p>Beaches</p>
            </div>
            <div class="category-card" onclick="#">
                <div class="category-emoji">⛰️</div>
                <p>Adventure</p>
            </div>
            <div class="category-card" onclick="#">
                <div class="category-emoji">🍽️</div>
                <p>Dining</p>
            </div>
            <div class="category-card" onclick="#">
                <div class="category-emoji">🎭</div>
                <p>Culture</p>
            </div>
            <div class="category-card" onclick="#">
                <div class="category-emoji">💕</div>
                <p>Romantic</p>
            </div>
        </div>
    </div>

    

</body>
